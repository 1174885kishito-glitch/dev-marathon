name: Release to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      - run: ssh ${{ steps.ssh.outputs.SERVER }} "cd /app/toshiki_kobayashi && git fetch origin main && git checkout -f origin/main -- deploy.sh && bash deploy.sh toshiki_kobayashi"
